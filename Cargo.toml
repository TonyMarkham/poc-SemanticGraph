[workspace]
members = [
    "crates/wip"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap                  = { version = "4.5.50", features = ["derive"] }
error-location        = { version = "0.1.0" }
prost                 = { version = "0.14.4" }
prost-build           = { version = "0.14.4" }
thiserror             = { version = "2.0.18" }
tree-sitter           = { version = "0.25.10" }
tree-sitter-c-sharp   = { version = "0.23.5" }
tree-sitter-css       = { version = "0.25.0" }
tree-sitter-razor     = { version = "0.1.0" }
tree-sitter-rust      = { version = "0.24.2" }

scip                  = { path = "submodules/scip/bindings/rust" }


[workspace.lints.clippy]
unwrap_used           = "deny"
expect_used           = "deny"
panic                 = "deny"

[workspace.lints.rust]
unused_must_use       = "deny"
